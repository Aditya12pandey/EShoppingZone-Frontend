<mat-toolbar color="primary" class="navbar">
  <div class="nav-container">
    <a routerLink="/" class="brand-logo">
      <mat-icon>shopping_cart</mat-icon>
      EShoppingZone
    </a>

    <span class="spacer"></span>

    <!-- Public Links -->
    <a mat-button routerLink="/">Products</a>

    <!-- Customer Links -->
    <ng-container *ngIf="authService.isLoggedIn() && authService.getRole() === 'CUSTOMER'">
      <a mat-button routerLink="/cart">
        <mat-icon>shopping_basket</mat-icon> Cart
      </a>
      <a mat-button routerLink="/my-orders">My Orders</a>
      <a mat-button routerLink="/wallet">Wallet</a>
    </ng-container>

    <!-- Merchant Links -->
    <ng-container *ngIf="authService.isLoggedIn() && authService.getRole() === 'MERCHANT'">
      <a mat-button routerLink="/merchant/dashboard">Merchant Dashboard</a>
    </ng-container>

    <!-- Admin Links -->
    <ng-container *ngIf="authService.isLoggedIn() && authService.getRole() === 'ADMIN'">
      <a mat-button routerLink="/admin/dashboard">Admin Dashboard</a>
    </ng-container>

    <!-- Auth Links -->
    <ng-container *ngIf="!authService.isLoggedIn()">
      <a mat-button routerLink="/login">Login</a>
      <a mat-raised-button color="accent" routerLink="/register">Register</a>
    </ng-container>

    <ng-container *ngIf="authService.isLoggedIn()">
      <button mat-icon-button [matMenuTriggerFor]="userMenu">
        <mat-icon>account_circle</mat-icon>
      </button>
      <mat-menu #userMenu="matMenu">
        <button mat-menu-item (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Logout</span>
        </button>
      </mat-menu>
    </ng-container>
  </div>
</mat-toolbar>
