<div class="auth-container">
  <mat-card class="auth-card">

    <!-- Header -->
    <div class="auth-header">
      <mat-icon class="auth-icon">shopping_bag</mat-icon>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Login to your EShoppingZone account</p>
    </div>

    <!-- Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="emailId" placeholder="user@example.com">
        <mat-icon matSuffix>email</mat-icon>
        <mat-error *ngIf="loginForm.get('emailId')?.hasError('required')">Email is required</mat-error>
        <mat-error *ngIf="loginForm.get('emailId')?.hasError('email')">Please enter a valid email</mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password">
        <button type="button" mat-icon-button matSuffix (click)="hidePassword = !hidePassword"
          [attr.aria-label]="'Toggle password'" [attr.aria-pressed]="hidePassword">
          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="loginForm.get('password')?.hasError('required')">Password is required</mat-error>
      </mat-form-field>

      <button mat-flat-button color="primary" type="submit" class="submit-btn"
        [disabled]="loginForm.invalid || loading">
        <mat-icon *ngIf="loading" class="spinner">sync</mat-icon>
        {{ loading ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <!-- Footer -->
    <div class="auth-footer">
      Don't have an account? <a routerLink="/register">Register here</a>
    </div>
  </mat-card>
</div>
