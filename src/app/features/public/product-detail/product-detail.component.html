<div class="detail-container">
  <div *ngIf="loading" class="loading-state">
    <mat-icon class="spinner">sync</mat-icon>
    <p>Loading product details...</p>
  </div>

  <div *ngIf="!loading && product" class="product-layout">
    <div class="image-section glass-card">
      <img [src]="product.image[0] || 'https://via.placeholder.com/600x600?text=No+Image'" [alt]="product.productName">
    </div>
    
    <div class="info-section glass-card">
      <mat-chip-listbox>
        <mat-chip color="primary" selected>{{ product.category }}</mat-chip>
      </mat-chip-listbox>
      
      <h1>{{ product.productName }}</h1>
      <p class="price">{{ product.price | currency:'INR' }}</p>
      
      <p class="description">{{ product.description }}</p>
      
      <mat-divider></mat-divider>
      
      <div class="specifications">
        <h3>Specifications</h3>
        <table class="spec-table">
          <tbody>
            <tr *ngFor="let spec of getSpecs()">
              <th>{{ spec.key }}</th>
              <td>{{ spec.value }}</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="actions">
        <button mat-flat-button color="accent" class="add-btn" (click)="addToCart()">
          <mat-icon>shopping_cart</mat-icon>
          Add to Cart
        </button>
        <a mat-stroked-button routerLink="/">Back to Products</a>
      </div>
    </div>
  </div>
</div>
